{% extends 'base.html' %}
{% block title %}登录 — 帧集 FrameLab{% endblock %}
{% block main %}
<div class="form-card" id="login-card">
  <h2>登录帧集</h2>
  <div class="field">
    <label>邮箱</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input id="password" type="password" placeholder="登录密码" autocomplete="current-password">
  </div>
  <button class="btn btn-block" onclick="doLogin()">登录</button>
  <div class="form-foot">
    <a href="javascript:showReset()">忘记密码</a>
    <a href="/register">注册新账号</a>
  </div>
</div>

<div class="form-card" id="reset-card" style="display:none">
  <h2>重置密码</h2>
  <div class="field">
    <label>邮箱</label>
    <input id="r-email" type="email" placeholder="注册时使用的邮箱">
  </div>
  <div class="field">
    <label>验证码</label>
    <div class="code-row">
      <input id="r-code" maxlength="6" placeholder="6 位验证码">
      <button class="btn btn-ghost" id="r-send" onclick="sendReset()">获取验证码</button>
    </div>
  </div>
  <div class="field">
    <label>新密码</label>
    <input id="r-pass" type="password" placeholder="至少 6 位，含字母和数字">
  </div>
  <button class="btn btn-block" onclick="doReset()">确认重置</button>
  <div class="form-foot">
    <a href="javascript:showLogin()">返回登录</a>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function showReset() {
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('reset-card').style.display = '';
}
function showLogin() {
  document.getElementById('reset-card').style.display = 'none';
  document.getElementById('login-card').style.display = '';
}

async function doLogin() {
  const res = await API.post('/api/auth/login', {
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
  });
  if (res.code !== 0) return API.toast(res.msg, false);
  API.setToken(res.data.token);
  API.toast('登录成功');
  setTimeout(() => location.href = '/index', 500);
}

async function sendReset() {
  const email = document.getElementById('r-email').value.trim();
  const res = await API.post('/api/auth/send-code', { email, type: 'reset' });
  if (res.code !== 0) return API.toast(res.msg, false);
  API.toast(res.msg);
  countdown(document.getElementById('r-send'));
}

async function doReset() {
  const res = await API.post('/api/auth/reset-password', {
    email: document.getElementById('r-email').value.trim(),
    code: document.getElementById('r-code').value.trim(),
    new_password: document.getElementById('r-pass').value,
  });
  if (res.code !== 0) return API.toast(res.msg, false);
  API.toast('密码已重置，请重新登录');
  setTimeout(showLogin, 800);
}

function countdown(btn) {
  let s = 60;
  btn.disabled = true;
  const t = setInterval(() => {
    btn.textContent = s + ' 秒后重发';
    if (--s < 0) { clearInterval(t); btn.disabled = false; btn.textContent = '获取验证码'; }
  }, 1000);
}
</script>
{% endblock %}
