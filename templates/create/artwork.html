{% extends 'base.html' %}
{% set platform = 'create' %}
{% block title %}作品详情 — 帧集 FrameLab{% endblock %}
{% block main %}
<div class="wrap" id="page">
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px">
    <a class="btn btn-ghost btn-sm" href="/create/shelf">← 返回书架</a>
    <a class="btn btn-ghost btn-sm" href="/create/studio">✎ 编辑作品（创作画布）</a>
    <button class="btn btn-sm" id="share-btn" onclick="shareLink()">🔗 分享链接</button>
  </div>

  <div style="display:flex;gap:28px;flex-wrap:wrap" id="detail"></div>

  <div class="card" style="padding:22px;margin-top:24px" id="comment-box">
    <b style="color:var(--text)">评论 <span class="chip" id="comment-count" style="font-size:11px"></span></b>
    <div id="comment-list" style="margin-top:12px"></div>
    <div class="field" style="margin-top:14px">
      <textarea id="comment-input" rows="3" placeholder="写下你的看法…"></textarea>
    </div>
    <button class="btn btn-sm" onclick="addComment()">发表评论</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const AID = {{ aid }};
let data = null;

async function load() {
  const res = await API.get('/create/api/artworks/' + AID);
  const box = document.getElementById('detail');
  if (res.code !== 0) {
    box.innerHTML = `<div class="card" style="padding:30px"><b>${API.esc(res.msg)}</b>
      <p class="muted" style="margin-top:8px"><a href="/create/shelf" style="color:var(--acc-create)">回书架 →</a></p></div>`;
    return;
  }
  data = res.data;
  const a = data.artwork;
  const srcName = {external: '外部工具', studio: '站内创作', course: '闯关作业',
                   order: '接单交付', workflow: '工作流'}[a.source] || a.source;
  box.innerHTML = `
    <div style="flex:none;max-width:520px;width:100%">
      <div class="cover" style="height:440px;border-radius:20px;background:${API.coverCss(a.cover)}"></div>
      ${a.cover && a.cover.startsWith('/') ? `<a class="btn btn-ghost btn-sm" style="display:inline-block;margin-top:12px" href="${API.esc(a.cover)}" download>下载原图</a>` : ''}
    </div>
    <div style="flex:1;min-width:300px">
      <h2 style="margin-bottom:6px">${API.esc(a.title)}</h2>
      <p class="muted">作者：${API.esc(data.author_name || '帧集创作者')} · ${a.created_at || ''}</p>

      <div class="card" style="padding:18px;margin-top:16px">
        <b style="color:var(--text)">作品介绍</b>
        <p style="margin-top:8px;line-height:1.9">
          <span class="chip chip-sm" style="font-size:12px;background:rgba(167,139,250,.16);color:var(--acc-create)">${API.esc(a.style_tag || '未分类')}</span>
          <span class="chip chip-sm" style="font-size:12px;background:rgba(79,214,180,.16);color:var(--acc-edu)">${srcName}</span>
          ${a.model ? `<span class="chip chip-sm" style="font-size:12px;background:rgba(242,201,76,.16);color:var(--gold)">模型：${API.esc(a.model)}</span>` : ''}
          ${a.tokens_spent ? `<span class="chip chip-sm" style="font-size:12px;background:rgba(255,107,139,.16);color:var(--danger)">消耗 ${a.tokens_spent} Token</span>` : ''}
        </p>
        ${a.note ? `<p style="margin-top:10px;line-height:1.9"><b>创作思路：</b>${API.esc(a.note)}</p>` : ''}
        ${a.prompt ? `<p style="margin-top:8px;line-height:1.9;background:var(--bg-elev);border-radius:10px;padding:10px 14px"><b>提示词：</b>${API.esc(a.prompt)}</p>` : ''}
      </div>

      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-sm" id="like-btn" onclick="toggleLike()">♡ 点赞</button>
        ${a.user_id ? `<a class="btn btn-ghost btn-sm" href="/profile/${a.user_id}">TA 的主页</a>` : ''}
      </div>

      ${data.owner ? `
      <div class="card" style="padding:18px;margin-top:16px">
        <b style="color:var(--text)">访问权限设置</b>
        <p class="muted" style="font-size:12.5px;margin-top:6px">分享链接按此权限对外展示</p>
        <div class="radio-row" style="margin-top:10px">
          <label><input type="radio" name="vis" value="0" ${a.visibility === 0 ? 'checked' : ''}> 私有（仅自己可见）</label>
          <label><input type="radio" name="vis" value="1" ${a.visibility === 1 ? 'checked' : ''}> 仅甲方可见</label>
          <label><input type="radio" name="vis" value="2" ${(a.visibility || 2) === 2 ? 'checked' : ''}> 完全公开</label>
        </div>
      </div>` : ''}
    </div>`;
}

async function setVis(v) {
  const res = await API.post(`/create/api/artworks/${AID}/visibility`, {visibility: parseInt(v)});
  API.toast(res.msg, res.code === 0);
}

async function loadLike() {
  const res = await API.get(`/api/market/artworks/${AID}/like`);
  if (res.code !== 0) return;
  const btn = document.getElementById('like-btn');
  btn.textContent = `${res.data.liked ? '♥' : '♡'} 点赞 ${res.data.likes}`;
  btn.dataset.liked = res.data.liked ? '1' : '';
}

async function toggleLike() {
  const me = await API.ensureLogin();
  if (!me) return location.href = '/login';
  const res = await API.post(`/api/market/artworks/${AID}/like`);
  if (res.code !== 0) return API.toast(res.msg, false);
  loadLike();
}

async function loadComments() {
  const res = await API.get(`/api/social/artworks/${AID}/comments`);
  if (res.code !== 0) return;
  const items = res.data.items;
  document.getElementById('comment-count').textContent = items.length;
  const me = await API.get('/api/auth/me');
  const myId = (me.code === 0 && me.data) ? (me.data.user || me.data).id : null;
  document.getElementById('comment-list').innerHTML = items.map(c => `
    <div class="trace-item">
      <span class="ic">💬</span>
      <span style="flex:1"><b>${API.esc(c.user_name)}</b>：${API.esc(c.content)}
        <span class="muted" style="font-size:11.5px;margin-left:8px">${c.created_at}</span></span>
      ${c.user_id === myId ? `<button class="btn btn-ghost btn-sm" onclick="delComment(${c.id})">删除</button>` : ''}
    </div>`).join('') || '<p class="muted">还没有评论，写下第一条吧。</p>';
}

async function addComment() {
  const me = await API.ensureLogin();
  if (!me) return location.href = '/login';
  const input = document.getElementById('comment-input');
  const res = await API.post(`/api/social/artworks/${AID}/comments`, {content: input.value});
  if (res.code !== 0) return API.toast(res.msg, false);
  API.toast(res.msg);
  input.value = '';
  loadComments();
}

async function delComment(cid) {
  const res = await API.delete(`/api/social/artworks/${AID}/comments/${cid}`);
  if (res.code !== 0) return API.toast(res.msg, false);
  API.toast(res.msg);
  loadComments();
}

document.addEventListener('change', e => {
  if (e.target.name === 'vis') setVis(e.target.value);
});

function shareLink() {
  if (!data) return;
  const url = location.origin + '/create/artwork/' + AID;
  const vis = data.artwork.visibility || 2;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() =>
      API.toast(vis === 0 ? '链接已复制（当前私有，外部打开会被拦截）' : '链接已复制，外部为只读视图'));
  } else {
    prompt('复制分享链接（外部只读）：', url);
  }
}

load(); loadLike(); loadComments();
</script>
{% endblock %}
